name: Build Garia OS Android App Bundle (AAB)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-aab:
    name: Build Unsigned Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Verify Gradle Installation
        run: gradle --version

      - name: Generate Fresh Gradle Wrapper
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          unzip -t gradle/wrapper/gradle-wrapper.jar
          unzip -l gradle/wrapper/gradle-wrapper.jar | grep 'GradleWrapperMain.class'
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Build Unsigned Release App Bundle
        working-directory: ./android
        run: |
          gradle bundleRelease --stacktrace

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: garia-os-v2.8.3-release-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

