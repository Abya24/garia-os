name: Build Garia OS Android Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-release-apk:
    name: Build Unsigned Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sanitize and Make Gradle Wrapper Executable
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Gradle Wrapper Diagnostic
        run: |
          pwd
          git rev-parse HEAD
          git ls-files android/gradle/wrapper/
          ls -lah android/gradle/wrapper/
          file android/gradle/wrapper/gradle-wrapper.jar
          unzip -t android/gradle/wrapper/gradle-wrapper.jar
          unzip -l android/gradle/wrapper/gradle-wrapper.jar | grep 'org/gradle/wrapper/GradleWrapperMain.class'
          sha256sum android/gradle/wrapper/gradle-wrapper.jar
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Release APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: garia-os-v1.6.0-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
