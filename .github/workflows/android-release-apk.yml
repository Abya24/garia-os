name: Build Garia OS Android Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-release-apk:
    name: Build Unsigned Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Verify Gradle Installation
        run: gradle --version

      - name: Generate Fresh Gradle Wrapper
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          unzip -t gradle/wrapper/gradle-wrapper.jar
          unzip -l gradle/wrapper/gradle-wrapper.jar | grep 'GradleWrapperMain.class'
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Build Release APK
        working-directory: ./android
        run: |
          gradle assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: garia-os-v3.0.0-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

