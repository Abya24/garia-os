name: Build Garia OS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Build Android APK (Garia OS v2.8.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Generate PNG Icons
        run: |
          npm install
          node scripts/generate_icons.cjs

      - name: Set up Python & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow & Verify PNG Resources
        run: |
          python -m pip install pillow
          python3 scripts/verify_pngs.py

      - name: Setup Keystore for Release Signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_DIR="android/app"
          KEYSTORE_FILE="$KEYSTORE_DIR/release.keystore"
          
          STORE_PASS="${RELEASE_KEYSTORE_PASSWORD:-gariaos123}"
          KEY_ALIAS="${RELEASE_KEY_ALIAS:-gariaos}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-gariaos123}"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "🔐 Decoding release keystore from secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          else
            echo "🔑 Generating dedicated release keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$STORE_PASS" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Garia OS, OU=Engineering, O=Garia OS, L=City, S=State, C=US"
          fi

          echo "RELEASE_KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
          echo "RELEASE_KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "✅ Keystore configured at $KEYSTORE_FILE"

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Verify APK Signature & Package Integrity
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          TARGET_APK="$RELEASE_DIR/Garia_OS_v2.8.3_Release_APK.apk"

          echo "Checking release APK directory..."
          ls -lh "$RELEASE_DIR"

          BUILT_APK=$(find "$RELEASE_DIR" -maxdepth 1 -name "*.apk" ! -name "*unsigned*" ! -name "Garia_OS_v2.8.3_Release_APK.apk" | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            BUILT_APK=$(find "$RELEASE_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          fi

          if [ -z "$BUILT_APK" ]; then
            echo "❌ ERROR: No APK file generated in $RELEASE_DIR"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$BUILT_APK")
          echo "Found built APK: $BUILT_APK ($FILE_SIZE bytes)"

          if [ "$FILE_SIZE" -lt 1048576 ]; then
            echo "❌ ERROR: APK file size is too small ($FILE_SIZE bytes)."
            exit 1
          fi

          # 1. Zip Integrity Check
          echo "🔍 Verifying ZIP container integrity..."
          unzip -t "$BUILT_APK" > /dev/null
          echo "✅ ZIP container structure is valid."

          # 2. Locate apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "❌ ERROR: apksigner tool not found in $ANDROID_HOME/build-tools"
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"

          # 3. Verify APK signature
          echo "🔐 Verifying APK signature..."
          VERIFY_OUTPUT=$($APKSIGNER verify --verbose --print-certs "$BUILT_APK")
          echo "$VERIFY_OUTPUT"

          if echo "$VERIFY_OUTPUT" | grep -q "DOES NOT VERIFY"; then
            echo "❌ ERROR: APK signature verification failed!"
            exit 1
          fi

          if ! echo "$VERIFY_OUTPUT" | grep -q "Verified"; then
            echo "❌ ERROR: APK is not signed or verification failed."
            exit 1
          fi

          echo "✅ APK signature verified successfully!"

          # 4. Copy/rename APK to final artifact name
          cp "$BUILT_APK" "$TARGET_APK"
          echo "✅ Prepared final signed artifact: $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Garia_OS_v2.8.3_Release_APK
          path: android/app/build/outputs/apk/release/Garia_OS_v2.8.3_Release_APK.apk
          retention-days: 30
