name: Build Garia OS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Build Android APK (Garia OS v2.4.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Generate PNG Icons
        run: |
          npm install
          node scripts/generate_icons.cjs

      - name: Set up Python & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow & Verify PNG Resources
        run: |
          python -m pip install pillow
          python3 scripts/verify_pngs.py

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Verify APK Output
        run: |
          RELEASE_APK_DIR="android/app/build/outputs/apk/release"
          echo "Checking APK directory: $RELEASE_APK_DIR"
          if [ -d "$RELEASE_APK_DIR" ]; then
            ls -lh "$RELEASE_APK_DIR"
            APK_FILE=$(find "$RELEASE_APK_DIR" -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              FILE_SIZE_BYTES=$(stat -c%s "$APK_FILE")
              echo "✅ Release APK generated: $APK_FILE"
              echo "File size: $(du -h "$APK_FILE" | cut -f1) ($FILE_SIZE_BYTES bytes)"
              if [ "$FILE_SIZE_BYTES" -lt 1048576 ]; then
                echo "❌ APK size is less than 1 MB ($FILE_SIZE_BYTES bytes). Invalid build."
                exit 1
              fi
            else
              echo "❌ No APK binary found in $RELEASE_APK_DIR"
              exit 1
            fi
          else
            echo "❌ Output directory $RELEASE_APK_DIR does not exist."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Garia_OS_v2.4.0_Release_APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
