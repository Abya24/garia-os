name: Build Garia OS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build-apk:
    name: Build Android APK (Garia OS v2.4.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Ensure Gradle Wrapper JAR
        run: |
          cd android
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper JAR missing. Regenerating with system Gradle..."
            gradle wrapper --gradle-version 8.2
          fi

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK Output
        run: |
          RELEASE_APK_DIR="android/app/build/outputs/apk/release"
          echo "Checking APK directory: $RELEASE_APK_DIR"
          if [ -d "$RELEASE_APK_DIR" ]; then
            ls -la "$RELEASE_APK_DIR"
            APK_FILE=$(find "$RELEASE_APK_DIR" -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              echo "✅ Release APK generated: $APK_FILE"
              echo "File size: $(du -h "$APK_FILE" | cut -f1)"
            else
              echo "❌ No APK binary found in $RELEASE_APK_DIR"
              exit 1
            fi
          else
            echo "❌ Output directory $RELEASE_APK_DIR does not exist."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Garia_OS_v2.4.0_Release_APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
