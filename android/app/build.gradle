plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gariaos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gariaos.app"
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName "2.8.2"

        manifestPlaceholders = [
            hostName: "ais-pre-v7vcv6eevdr5eg5w3uyx6h-727347822999.asia-southeast1.run.app",
            defaultUrl: "https://ais-pre-v7vcv6eevdr5eg5w3uyx6h-727347822999.asia-southeast1.run.app/",
            launcherName: "Garia OS",
            assetStatements: '[]'
        ]
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (storeFilePath != null && file(storeFilePath).exists()) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "gariaos123"
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "gariaos"
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "gariaos123"
            } else if (file("release.keystore").exists()) {
                storeFile file("release.keystore")
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "gariaos123"
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "gariaos"
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "gariaos123"
            } else if (file("../release.keystore").exists()) {
                storeFile file("../release.keystore")
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "gariaos123"
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "gariaos"
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "gariaos123"
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.browser:browser:1.8.0'
}

